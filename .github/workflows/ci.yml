name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck db_tuning_check.sh tests/*.sh

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: --help and --version exit 0
        run: |
          ./db_tuning_check.sh --help | grep -q '^Usage:'
          ./db_tuning_check.sh -h | grep -q '^Usage:'
          ./db_tuning_check.sh --version | grep -q '^db_tuning_check.sh '
      - name: Bad options give exit 3
        run: |
          set +e
          ./db_tuning_check.sh --nope; rc=$?; echo "exit code: $rc"; [ "$rc" -eq 3 ] || exit 1
          ./db_tuning_check.sh --db-user; rc=$?; echo "exit code: $rc"; [ "$rc" -eq 3 ] || exit 1
          ./db_tuning_check.sh --sysroot /nonexistent; rc=$?; echo "exit code: $rc"; [ "$rc" -eq 3 ] || exit 1
      - name: Report runs on the runner
        run: |
          set +e; ./db_tuning_check.sh -u runner > report.md; rc=$?; set -e
          cat report.md; echo "exit code: $rc"
          [ "$rc" -le 2 ]
          grep -q '^# Linux DB tuning check' report.md
          grep -q '| DB OS user | runner |' report.md
          grep -Eq '^Overall: \*\*(OK|WARN|CRIT)\*\*' report.md
          grep -Eq '^\| vm\.swappiness \| [0-9]+ \| (OK|WARN) \|' report.md
          grep -q '^## Suggested PostgreSQL settings' report.md
          grep -Eq '^shared_buffers +=  ?[0-9]+(MB|GB)$' report.md
      - name: Bad option values give exit 3
        run: |
          set +e
          for args in "--max-connections 0" "--storage floppy" "--shared-buffers 8"; do
            # shellcheck disable=SC2086
            ./db_tuning_check.sh $args; rc=$?; echo "$args -> exit $rc"; [ "$rc" -eq 3 ] || exit 1
          done

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every fixture host gets the expected statuses and exit code
        run: tests/run-fixtures.sh

  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: --json is valid and matches the Markdown statuses
        run: |
          set +e; ./db_tuning_check.sh --sysroot tests/fixtures/defaults --json > d.json; rc=$?; set -e
          jq . d.json
          [ "$rc" -eq 1 ]
          jq -e '.status == "WARN" and .counts.warn > 0 and .counts.crit == 0' d.json
          jq -e '.checks[] | select(.check == "vm.swappiness") | .status == "WARN" and .value == "60"' d.json
          jq -e '.postgresql[] | select(.setting == "shared_buffers") | .value == "3840MB"' d.json
          set +e; ./db_tuning_check.sh --sysroot tests/fixtures/risky --json > r.json; rc=$?; set -e
          [ "$rc" -eq 2 ]
          jq -e '.status == "CRIT" and ([.checks[] | select(.status == "CRIT")] | length) == 2' r.json

  distros:
    # The same script on the distributions it is meant for: Bash, awk and
    # coreutils from each base image, real /proc and /sys of the runner.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["rockylinux:9", "ubuntu:24.04", "debian:12"]
    steps:
      - uses: actions/checkout@v4
      - name: Run in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "${{ matrix.image }}"             bash -c './db_tuning_check.sh --db-user root --json > /tmp/out.json; rc=$?; cat /tmp/out.json; exit $rc' > out.json || rc=$?
          echo "exit code: ${rc:-0}"
          [ "${rc:-0}" -le 2 ]
          jq -e '.checks | length > 8' out.json
          jq -e '.os | length > 0' out.json
          jq -r '.os, .status, (.checks[] | "\(.status)	\(.check)	\(.value)")' out.json
